[platformio]
default_envs = heltec_v3_proxy

[env]
platform = espressif32@6.5.0
framework = arduino
board_build.filesystem = littlefs
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/merge_bin.py
build_flags =
    -O2
    -Wall
    -Wextra
    -DPROXY_RELEASE_VERSION=\"2026.11.1\"
monitor_speed = 115200

[env:heltec_v3_proxy]
board = heltec_wifi_lora_32_V3
board_build.partitions = partitions.csv

[env:heltec_v3_proxy_debug]
extends = env:heltec_v3_proxy
build_flags =
    ${env.build_flags}
    -DDEBUG=1
; Heltec V3: UART0 (GPIO43/44) reaches the CP210x bridge. Never enable
; ARDUINO_USB_CDC_ON_BOOT here — Serial must stay mapped to UART0
; (see the original mockup platformio.ini rationale).

[env:heltec_wsl_v3_proxy]
extends = env:heltec_v3_proxy ; same ESP32-S3FN8 + SX1262 wiring, no OLED
build_flags =
    ${env.build_flags}
    -DPROXY_BOARD_HELTEC_WSL_V3=1

[env:heltec_wsl_v3_proxy_debug]
extends = env:heltec_wsl_v3_proxy
build_flags =
    ${env:heltec_wsl_v3_proxy.build_flags}
    -DDEBUG=1

[env:lora32_v1_6_proxy]
board = ttgo-lora32-v1
board_build.partitions = partitions_lora32.csv
build_flags =
    ${env.build_flags}
    -DPROXY_RADIO_SX1276=1

[env:lora32_v1_6_proxy_debug]
extends = env:lora32_v1_6_proxy
build_flags =
    ${env:lora32_v1_6_proxy.build_flags}
    -DDEBUG=1
