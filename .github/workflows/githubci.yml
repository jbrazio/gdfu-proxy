name: Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Host tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Read version and decide publishing
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          version=$(python3 scripts/build-version.py)
          python3 scripts/release-notes.py "$version"
          base=${version%-*}                      # 2026.11.1-rc2-abc1234 -> 2026.11.1-rc2
          [[ "$version" == *-rc* ]] && rc=true || { rc=false; base=$version; }
          case "$REF:$rc" in
            refs/heads/dev:true) channel=prerelease ;;
            refs/heads/master:false) channel=release ;;
            refs/heads/dev:* | refs/heads/master:*)
              [[ "$EVENT_NAME" == workflow_dispatch ]] && { echo "::error::$REF needs $([[ $rc == true ]] && echo 'a stable' || echo 'an -rcN') version, got $version"; exit 1; }
              echo "Version $version does not publish from $REF"; channel=none ;;
            *) channel=none ;;
          esac
          publish=false
          if [[ "$channel" != none && "$EVENT_NAME" =~ ^(push|workflow_dispatch)$ ]]; then
            # A dev RC publishes once per -rcN (tags are v<version>-<sha>); master once per exact version.
            # Manual runs force publishing and replace the existing release of this exact tag.
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$base" --jq '.[].ref' \
              | awk -v t="refs/tags/v$base" -v rc="$rc" '$0 == t || (rc == "true" && index($0, t "-") == 1)')
            if [[ "$EVENT_NAME" == workflow_dispatch || -z "$existing" ]]; then
              publish=true
            else
              echo "Already published for v$base:"; echo "$existing"
            fi
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'publish=%s\n' "$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        board: [heltec_v3_proxy, heltec_wsl_v3_proxy, lora32_v1_6_proxy]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          GDFU_BUILD_VERSION: ${{ needs.validate.outputs.version }}
        run: pio run -e "$BOARD"
      - name: Package firmware
        env:
          BOARD: ${{ matrix.board }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p out
          cp ".pio/build/$BOARD/firmware.bin" "out/${BOARD}-${RELEASE_VERSION}.bin"
          cp ".pio/build/$BOARD/firmware-merged.bin" "out/${BOARD}-${RELEASE_VERSION}-merged.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/release-notes.py "$RELEASE_VERSION"
      - name: Replace existing release (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" 2>/dev/null || true
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.validate.outputs.channel == 'prerelease' }}
          make_latest: ${{ needs.validate.outputs.channel == 'release' && 'true' || 'false' }}
          fail_on_unmatched_files: true
          files: |
            out/*.bin

